name: forge-tofu
version: 1.0.0
description: OpenTofu + Terragrunt project declaratively managing DivitMittal repositories across GitHub, GitLab, Codeberg, gitea.com and SourceHut with Nix flake tooling
author: DivitMittal
target:
  - claude
  - codex
  - opencode
type: instructions

dependencies:
  mcp:
    - name: serena
      registry: false
      transport: stdio
      command: uvx
      args:
        - --from
        - git+https://github.com/oraios/serena
        - serena
        - start-mcp-server
        - --context
        - claude-code
        - --project
        - ~/Projects/gh/forge-tofu/
    - name: terraform
      registry: false
      transport: stdio
      command: terraform-mcp-server
      args:
        - stdio
        - --toolsets=registry
