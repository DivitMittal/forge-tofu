# ---------------------------------------------------------------------------
# Atlantis repo-side configuration.
#
# Two project units (one per GitHub org), both driven by Terragrunt.
# DivitMittal additionally pulls its repo map from `terranix/orgs/DivitMittal.nix`
# via the `generate "locals"` block in orgs/DivitMittal/terragrunt.hcl,
# which runs `nix build .#divitmittal-locals` at init time. The Atlantis
# server image (see Dockerfile) ships with `nix` + `terragrunt` for this.
#
# Server-side allowlist required (atlantis-server config):
#   --allow-repo-config (or repos.yaml with allowed_overrides: [workflow])
# so this file's `workflow:` references are honored.
# ---------------------------------------------------------------------------
version: 3

automerge: false
delete_source_branch_on_merge: false
parallel_plan: false   # serialised — both orgs share the same Nix store cache
parallel_apply: false

projects:
  - name: divitmittal
    dir: orgs/DivitMittal
    workspace: default
    workflow: terragrunt-nix
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "*.hcl"
        - "../../root.hcl"
        - "../../flake.nix"
        - "../../flake.lock"
        - "../../flake/**/*.nix"
        - "../../modules/**/*.tf"
        - "../../terranix/orgs/DivitMittal.nix"

  - name: qezta
    dir: orgs/Qezta
    workspace: default
    workflow: terragrunt-nix
    autoplan:
      enabled: true
      when_modified:
        - "*.tf"
        - "*.hcl"
        - "../../root.hcl"
        - "../../modules/**/*.tf"

workflows:
  terragrunt-nix:
    plan:
      steps:
        - env:
            name: TERRAGRUNT_TFPATH
            command: 'echo terraform'
        - env:
            name: TF_IN_AUTOMATION
            command: 'echo true'
        - run: terragrunt init -no-color -input=false
        - run: terragrunt plan -no-color -input=false -lock-timeout=5m -out=$PLANFILE
    apply:
      steps:
        - run: terragrunt apply -no-color -input=false -lock-timeout=5m $PLANFILE
